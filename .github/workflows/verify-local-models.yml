name: Verify local model changes

on:
  workflow_dispatch:
  push:
    branches:
      - feat/local-models-qwen

jobs:
  desktop-types:
    name: Desktop typecheck and lint
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm exec turbo run build --filter=desktop^...

      - name: Typecheck desktop
        working-directory: apps/desktop
        run: pnpm exec tsc --noEmit

      # `pnpm run lint` also runs `prettier --check`, which fails on every file
      # in this repository when Windows git checks out with CRLF (no
      # .gitattributes / prettier config pins the line ending). Run oxlint only.
      - name: Lint desktop
        working-directory: apps/desktop
        run: pnpm exec oxlint src

      - name: Unit tests
        working-directory: apps/desktop
        run: pnpm run test:unit

  sidecar-tests:
    name: Sidecar Rust tests
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust_transcription -> target

      - name: Run sidecar tests
        run: cargo test --manifest-path packages/rust_transcription/Cargo.toml --lib
