name: Build Desktop

on:
  pull_request:
    branches:
      - main
      - linting
    paths:
      - "apps/desktop/**"
      - ".github/workflows/build-desktop.yml"

jobs:
  build:
    name: Build Desktop (Windows)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target

      # The Windows runner is short on C:, so cargo's target dir (and with it
      # the bundle output) is redirected to the D: scratch disk.
      - name: Set Windows build environment
        shell: pwsh
        run: |
          echo "CARGO_TARGET_DIR=D:\cargo" >> $env:GITHUB_ENV

      - name: Set sidecar build environment
        shell: pwsh
        run: |
          echo "CMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE\packages\rust_transcription\cmake\windows-ci-toolchain.cmake" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend and dependencies
        env:
          TAURI_PLATFORM: windows
          VOQUILL_DESKTOP_PLATFORM: win32
        run: pnpm exec turbo run build --filter=desktop...

      - name: Build Tauri app
        env:
          TAURI_PLATFORM: windows
          VOQUILL_DESKTOP_PLATFORM: win32
        working-directory: apps/desktop
        run: pnpm run tauri build --ci

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voquill-windows
          path: |
            ${{ env.CARGO_TARGET_DIR }}\release\bundle\**\*.msi
            ${{ env.CARGO_TARGET_DIR }}\release\bundle\**\*.exe
          if-no-files-found: warn
          retention-days: 7
